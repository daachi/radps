# Local single-node k3s — full JupyterHub values

hub:
  config:
    JupyterHub:
      authenticator_class: firstuseauthenticator.FirstUseAuthenticator
    Authenticator:
      admin_users:
        - jsteeb
    FirstUseAuthenticator:
      create_users: true
      auto_login: false
      password_validator:
        pattern: '^.{8,}$'
        message: 'Password must be at least 8 characters.'
    KubeSpawner:
      start_timeout: 300
      http_timeout: 300

  db:
    type: sqlite-pvc
    pvc:
      accessModes:
        - ReadWriteOnce
      storage: 5Gi
      storageClassName: local-path

singleuser:
  startTimeout: 300
  serviceAccountName: dask-jupyter-role
  image:
    name: ghcr.io/casangi/radps-jupyter-notebook
    tag: "v0.0.6"
    pullPolicy: IfNotPresent
  extraEnv:
    PREFECT_API_URL: "http://prefect-server.prefect-server.svc:4200/api"
  cpu:
    limit: 2
    guarantee: 0.5
  memory:
    limit: 2G
    guarantee: 256M
  storage:
    type: dynamic
    capacity: 5Gi
    dynamic:
      storageClass: local-path
    extraVolumes:
      common-data:
        name: common-data
        persistentVolumeClaim:
          claimName: radps-hub-pvc
    extraVolumeMounts:
      common-data:
        name: common-data
        mountPath: /home/jovyan/shared

proxy:
  service:
    type: ClusterIP
  https:
    enabled: false

scheduling:
  userScheduler:
    enabled: true
  podPriority:
    enabled: true
  userPlaceholder:
    enabled: false
  userPods:
    nodeAffinity:
      matchNodePurpose: prefer
