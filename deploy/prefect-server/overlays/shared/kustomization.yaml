apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prefect-server

resources:
  - ../../base

patches:
  - path: ingress-patch.yaml

helmCharts:
  - name: prefect-server
    repo: https://prefecthq.github.io/prefect-helm
    releaseName: prefect-server
    namespace: prefect-server
    valuesFile: values.yaml
